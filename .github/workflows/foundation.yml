name: Foundation verification
on:
  push:
    branches: [main]
    paths:
      - 'game/**'
      - 'tests/**'
      - '.github/workflows/foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check pytest
      - run: python -m pytest -q tests/test_p1_static.py tests/test_p2_static.py tests/test_p3_static.py tests/test_p4_static.py tests/test_p41_static.py tests/test_p5_static.py tests/test_p6_static.py

  godot-headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install official Godot 4.7.2 stable
        shell: bash
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip \
            --output /tmp/godot-4.7.2.zip
          mkdir -p /tmp/godot-bin
          unzip -q /tmp/godot-4.7.2.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
          sudo mv /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
      - name: Import project in headless editor
        run: godot --headless --path game --editor --quit
      - name: Run P1 headless Godot tests
        run: godot --headless --path game --script res://tests/test_p1.gd
      - name: Run P2 headless Godot tests
        run: godot --headless --path game --script res://tests/test_p2.gd

      - name: Run P3 home and autonomy tests
        run: godot --headless --path game --script res://tests/test_p3.gd
      - name: Run P4 gate and legal continuity tests
        run: godot --headless --path game --script res://tests/test_p4.gd
      - name: Run P4 home-to-gate scene interaction test
        run: godot --headless --path game --script res://tests/test_p4_ui.gd
      - name: Run P4.1 repeated-day and identity tests
        run: godot --headless --path game --script res://tests/test_p41.gd
      - name: Run P5 refuge management tests
        run: timeout 60s godot --headless --path game --script res://tests/test_p5.gd
      - name: Run P5 home/gate/refuge scene route
        run: timeout 60s godot --headless --path game --script res://tests/test_p5_ui.gd
      - name: Run P6 two-day continuity and save upgrade tests
        run: timeout 60s godot --headless --path game --script res://tests/test_p6.gd
      - name: Run P6 complete UI route tests
        run: timeout 60s godot --headless --path game --script res://tests/test_p6_ui.gd
      - name: Verify primary controls at 960x540
        run: timeout 60s godot --headless --path game --script res://tests/test_p6_layout.gd
      - name: Boot main P6 QA home scene
        run: godot --headless --path game --quit-after 12


  windows-headless:
    name: Windows Godot headless smoke (not a visual playtest)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install official Windows Godot 4.7.2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "godot-4.7.2-win.zip"
          $unpack = Join-Path $env:RUNNER_TEMP "godot-4.7.2-win"
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $unpack -Force
          $binary = Get-ChildItem -Path $unpack -Recurse -Filter "*_console.exe" | Select-Object -First 1
          if ($null -eq $binary) { throw "Godot Windows console binary not found" }
          "GODOT_BIN=$($binary.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $binary.FullName --headless --version
          if ($LASTEXITCODE -ne 0) { throw "Windows Godot version check failed" }
      - name: Windows editor import
        shell: pwsh
        run: |
          & $env:GODOT_BIN --headless --path game --editor --quit
          if ($LASTEXITCODE -ne 0) { throw "Windows Godot editor import failed" }
      - name: Windows P1-P6 headless regressions
        shell: pwsh
        run: |
          foreach ($test in @("test_p1.gd", "test_p2.gd", "test_p3.gd", "test_p4.gd", "test_p4_ui.gd", "test_p41.gd", "test_p5.gd", "test_p5_ui.gd", "test_p6.gd", "test_p6_ui.gd", "test_p6_layout.gd")) {
            Write-Host "Running $test on Windows"
            & $env:GODOT_BIN --headless --path game --script "res://tests/$test"
            if ($LASTEXITCODE -ne 0) { throw "$test failed on Windows with exit code $LASTEXITCODE" }
          }
      - name: Windows main-scene startup smoke
        shell: pwsh
        run: |
          & $env:GODOT_BIN --headless --path game --quit-after 12
          if ($LASTEXITCODE -ne 0) { throw "Windows startup smoke failed" }

      - name: Package portable Windows QA runner (official Godot executable + project)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bundle = Join-Path $env:RUNNER_TEMP "UnbearableConditions-P6-QA-Windows"
          New-Item -Path $bundle -ItemType Directory -Force | Out-Null
          Copy-Item -Path "game" -Destination (Join-Path $bundle "game") -Recurse
          $cache = Join-Path $bundle "game\.godot"
          if (Test-Path $cache) { Remove-Item -Path $cache -Recurse -Force }
          $editor = Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP "godot-4.7.2-win") -Recurse -Filter "Godot_v4.7.2-stable_win64.exe" | Select-Object -First 1
          if ($null -eq $editor) { throw "Official Godot Windows runtime not found" }
          Copy-Item -Path $editor.FullName -Destination (Join-Path $bundle "Godot_v4.7.2-stable_win64.exe")
          $launch = '@echo off' + [Environment]::NewLine + 'cd /d "%~dp0"' + [Environment]::NewLine + '"Godot_v4.7.2-stable_win64.exe" --path "game"' + [Environment]::NewLine
          [System.IO.File]::WriteAllText((Join-Path $bundle "PLAY_P6_QA.bat"), $launch, [System.Text.Encoding]::ASCII)
          @"
          UNBEARABLE CONDITIONS — P6 QA RUNNER
          ====================================
          Double-click PLAY_P6_QA.bat in this folder.
          This package includes the official Godot 4.7.2 Windows executable
          and the Godot source project. It is not a final exported game.

          Start at Mama's den. Interact with Button and Hazel.
          Go to gate on the first workday. Complete or end the shift.
          Return home, choose Next day, and go to Briarwood Refuge.
          Only anonymous QA applicants and provisional laws/prices exist.
          The first recurring character story has not been approved.
          Save/load uses a development save; old developer schemas are limited.
          Gameplay usability and visual quality are not yet human-certified.
          "@ | Set-Content -Path (Join-Path $bundle "README_QA.txt") -Encoding UTF8
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/godotengine/godot/4.7.2-stable/LICENSE.txt" -OutFile (Join-Path $bundle "GODOT_LICENSE.txt")
          Write-Host "Portable QA folder prepared. Godot binary and source included."
      - uses: actions/upload-artifact@v4
        with:
          name: UnbearableConditions-P6-QA-Windows
          path: ${{ runner.temp }}/UnbearableConditions-P6-QA-Windows/
          retention-days: 30
          if-no-files-found: error


  visual-snapshot:
    name: Godot real-render screenshots on Linux virtual display
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2 and virtual X display
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libgl1
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip \
            --output /tmp/godot-4.7.2.zip
          mkdir -p /tmp/godot-bin
          unzip -q /tmp/godot-4.7.2.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
          sudo mv /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
      - name: Import Godot project under virtual display
        run: xvfb-run -a -s "-screen 0 1280x800x24" godot --path game --editor --quit
      - name: Render actual home, gate and refuge screenshots
        run: xvfb-run -a -s "-screen 0 1280x800x24" godot --path game --script res://tests/capture_p6.gd
      - uses: actions/upload-artifact@v4
        with:
          name: UnbearableConditions-P6-Visual-Screenshots
          path: game/p6_visual_*.png
          retention-days: 30
          if-no-files-found: error
